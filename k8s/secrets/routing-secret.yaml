apiVersion: v1
kind: Secret
metadata:
  name: routing-config-secret
type: Opaque
stringData:
  # In a real production environment, this would hold DockerHub tokens
  # or sensitive ML Model API keys. For our local architecture, we store
  # baseline configuration limits securely.
  MAX_CONCURRENCY: "1000"
  DEFAULT_ROUTING_MODE: "adaptive"
  HYSTERESIS_THRESHOLD: "0.15"

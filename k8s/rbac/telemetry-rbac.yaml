apiVersion: v1
kind: ServiceAccount

metadata:
  name: telemetry-service-account

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: telemetry-role

rules:
  - apiGroups: [""]
    resources:
      - pods
      - services
      - nodes
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: telemetry-rolebinding

subjects:
  - kind: ServiceAccount
    name: telemetry-service-account
    namespace: default

roleRef:
  kind: ClusterRole
  name: telemetry-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: 'fastapi-router'
        metrics_path: /metrics
        static_configs:
          - targets:
              - fastapi-router-service:8000

      - job_name: 'toxic-baseline'
        metrics_path: /metrics
        static_configs:
          - targets:
              - toxic-baseline-service:8000

      - job_name: 'toxic-bert'
        metrics_path: /metrics
        static_configs:
          - targets:
              - toxic-bert-service:8000

      - job_name: 'toxic-roberta'
        metrics_path: /metrics
        static_configs:
          - targets:
              - toxic-roberta-service:8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-service
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
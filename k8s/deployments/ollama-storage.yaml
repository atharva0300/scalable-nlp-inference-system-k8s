apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-model-store
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-init-job
spec:
  template:
    spec:
      containers:
      - name: ollama-init
        image: ollama/ollama:latest
        command: ["/bin/sh", "-c"]
        args:
        - "ollama serve & sleep 5 && ollama pull tinyllama && ollama pull phi3 && kill $!"
        volumeMounts:
        - name: model-store
          mountPath: /root/.ollama
      restartPolicy: OnFailure
      volumes:
      - name: model-store
        persistentVolumeClaim:
          claimName: ollama-model-store

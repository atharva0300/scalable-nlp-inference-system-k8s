# =============================================================================
# NLP Model Services — 4 HuggingFace Tiers
# All share the same Docker image; MODEL_NAME env var selects the model.
# =============================================================================

# ── Tier 1: DistilBERT (fastest, ~0.3–0.5s) ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-distilbert
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nlp-distilbert
  template:
    metadata:
      labels:
        app: nlp-distilbert
    spec:
      containers:
      - name: infer
        image: nlp-distilbert:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: MODEL_NAME
          value: "distilbert-base-uncased-finetuned-sst-2-english"
        - name: SERVICE_TIER
          value: "distilbert"
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-distilbert-service
spec:
  selector:
    app: nlp-distilbert
  ports:
  - port: 8001
    targetPort: 8001

---
# ── Tier 2: BERT Base (moderate, ~1–2s) ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-bert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nlp-bert
  template:
    metadata:
      labels:
        app: nlp-bert
    spec:
      containers:
      - name: infer
        image: nlp-bert:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: MODEL_NAME
          value: "textattack/bert-base-uncased-SST-2"
        - name: SERVICE_TIER
          value: "bert"
        resources:
          requests:
            cpu: "300m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-bert-service
spec:
  selector:
    app: nlp-bert
  ports:
  - port: 8001
    targetPort: 8001

---
# ── Tier 4: DeBERTa (best quality, ~3–5s) ────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nlp-deberta
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nlp-deberta
  template:
    metadata:
      labels:
        app: nlp-deberta
    spec:
      containers:
      - name: infer
        image: nlp-deberta:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: MODEL_NAME
          value: "cross-encoder/nli-deberta-v3-base"
        - name: SERVICE_TIER
          value: "deberta"
        resources:
          requests:
            cpu: "400m"
            memory: "768Mi"
          limits:
            cpu: "1500m"
            memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: nlp-deberta-service
spec:
  selector:
    app: nlp-deberta
  ports:
  - port: 8001
    targetPort: 8001

# GATEWAY ROUTER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi-router
  template:
    metadata:
      labels:
        app: fastapi-router
    spec:
      serviceAccountName: telemetry-service-account
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
      - name: fastapi-router
        image: atharva0300/fastapi-router:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: ROLE
          value: "router"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: fastapi-router-service
spec:
  selector:
    app: fastapi-router
  ports:
  - port: 8000
    targetPort: 8000
---

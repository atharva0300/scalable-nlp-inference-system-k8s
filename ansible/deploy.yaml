---
- name: Deploy NLP System to Kubernetes
  hosts: localhost
  connection: local

  tasks:

    - name: Verify kubectl access
      command: kubectl get nodes

    - name: Apply Kubernetes manifests
      command: kubectl apply -f k8s/

    - name: Restart deployments
      command: >
        kubectl rollout restart deployment
        fastapi-router
        toxic-baseline
        toxic-bert
        toxic-roberta

    - name: Wait for router rollout
      command: kubectl rollout status deployment/fastapi-router --timeout=120s
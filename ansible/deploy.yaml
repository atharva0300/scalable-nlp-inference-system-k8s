---
- name: Deploy NLP System to Kubernetes
  hosts: localhost
  connection: local

  tasks:

    - name: Verify kubectl access
      command: kubectl get nodes

    - name: Apply deployments
      command: kubectl apply -f ../k8s/deployments/

    - name: Apply services
      command: kubectl apply -f ../k8s/services/

    - name: Apply autoscaling
      command: kubectl apply -f ../k8s/hpa/

    - name: Restart deployments
      command: >
        kubectl rollout restart deployment
        fastapi-router
        toxic-baseline
        toxic-bert
        toxic-roberta

    - name: Wait for router rollout
      command: kubectl rollout status deployment/fastapi-router --timeout=120s